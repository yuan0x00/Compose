[versions]
# ===== 核心工具链 =====
agp = "8.12.3"
kotlin = "2.2.20"
ksp = "2.2.20-2.0.4"

# ===== AndroidX 核心 =====
androidx-core-ktx = "1.17.0"
androidx-lifecycle = "2.9.4"
androidx-activity-compose = "1.11.0"
androidx-compose-bom = "2025.10.00"

# ===== AndroidX 扩展 =====
androidx-navigation-compose = "2.9.5"
androidx-datastore = "1.1.7"
androidx-room = "2.8.2"
androidx-paging = "3.3.6"
androidx-webkit = "1.14.0"
androidx-camera = "1.5.1"
androidx-splash = "1.0.1"

# ===== Material & UI =====
material3 = "1.4.0"
material-icons-extended = "1.7.8"
accompanist = "0.37.3"

# ===== 网络相关 =====
retrofit = "3.0.0"
okhttp = "5.2.1"
kotlinx-serialization-json = "1.9.0"
retrofit2-kotlinx-serialization = "1.0.0"

# ===== 协程 =====
kotlinx-coroutines = "1.10.2"

# ===== 依赖注入 =====

# ===== 图片加载 =====
coil = "2.7.0"

# ===== 工具库 =====
zxing = "3.5.3"
mlkit-barcode = "17.3.0"

# ===== 测试 =====
junit = "4.13.2"
androidx-test-ext-junit = "1.3.0"
espresso = "3.7.0"

# ===== 构建工具 =====
android-tools = "31.13.0"


[libraries]
# ===== AndroidX 核心 =====
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core-ktx" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "androidx-lifecycle" }
androidx-lifecycle-livedata-ktx = { module = "androidx.lifecycle:lifecycle-livedata-ktx", version.ref = "androidx-lifecycle" }

# ===== Compose =====
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "androidx-compose-bom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-animation = { module = "androidx.compose.animation:animation" }
androidx-compose-runtime-livedata = { module = "androidx.compose.runtime:runtime-livedata" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity-compose" }

# ===== AndroidX 扩展 =====
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "androidx-navigation-compose" }
androidx-datastore-core = { module = "androidx.datastore:datastore-core", version.ref = "androidx-datastore" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "androidx-datastore" }
androidx-paging-compose = { module = "androidx.paging:paging-compose", version.ref = "androidx-paging" }
androidx-webkit = { module = "androidx.webkit:webkit", version.ref = "androidx-webkit" }
androidx-splash = { module = "androidx.core:core-splashscreen", version.ref = "androidx-splash" }

# ===== Room =====
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "androidx-room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "androidx-room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "androidx-room" }

# ===== Camera =====
androidx-camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "androidx-camera" }
androidx-camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "androidx-camera" }
androidx-camera-view = { module = "androidx.camera:camera-view", version.ref = "androidx-camera" }

# ===== Material & UI 扩展 =====
material-icons-extended = { module = "androidx.compose.material:material-icons-extended", version.ref = "material-icons-extended" }
accompanist-permissions = { module = "com.google.accompanist:accompanist-permissions", version.ref = "accompanist" }

# ===== 网络 =====
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-serialization = { module = "com.squareup.retrofit2:converter-kotlinx-serialization", version.ref = "retrofit" }
retrofit2-kotlinx-serialization-converter = { module = "com.jakewharton.retrofit:retrofit2-kotlinx-serialization-converter", version.ref = "retrofit2-kotlinx-serialization" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
logging-interceptor = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }
kotlinx-serialization = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization-json" }

# ===== 协程 =====
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }

# ===== 依赖注入 =====

# ===== 图片加载 =====
coil-compose = { module = "io.coil-kt:coil-compose", version.ref = "coil" }

# ===== 工具库 =====
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }
mlkit-barcode-scanning = { module = "com.google.mlkit:barcode-scanning", version.ref = "mlkit-barcode" }

# ===== 测试 =====
junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext-junit" }
androidx-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }

# ===== 构建工具（build-logic 使用）=====
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
android-tools-common = { module = "com.android.tools:common", version.ref = "android-tools" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
ksp-gradle-plugin = { module = "com.google.devtools.ksp:com.google.devtools.ksp.gradle.plugin", version.ref = "ksp" }


[plugins]
# ===== Android 插件 =====
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }

# ===== Kotlin 插件 =====
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

# ===== KSP =====
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }

# ===== 自定义插件（build-logic 定义）=====
local-android-application = { id = "local.android.application", version = "unspecified" }
local-android-library = { id = "local.android.library", version = "unspecified" }
